<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0F2B1D">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://*.tile.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Colorado Golf Course Map | EveryCourse</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root{--green:#0F2B1D;--green2:#244B35;--cream:#F4F0E6;--gold:#EFB93F;--ink:#17231c;--muted:#66736c;--line:rgba(15,43,29,.16);--shadow:0 14px 40px rgba(15,43,29,.18)}
    *{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream);overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.toolbar{position:relative;z-index:1000;display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));background:var(--green);box-shadow:0 3px 16px rgba(0,0,0,.2)}
    .search-wrap{position:relative;min-width:0}.search{width:100%;height:46px;border:0;border-radius:12px;padding:0 42px 0 15px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.search-clear{position:absolute;right:5px;top:5px;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:21px;display:none}.search-clear.show{display:block}
    .tool-btn,.seg-btn{height:46px;border:1px solid rgba(255,255,255,.26);border-radius:12px;background:var(--green2);color:#fff;font-weight:800;padding:0 15px}.tool-btn[aria-expanded="true"],.seg-btn.active{background:var(--gold);color:var(--green);border-color:var(--gold)}.view-toggle{display:flex;border:1px solid rgba(255,255,255,.26);border-radius:12px;overflow:hidden}.seg-btn{border:0;border-radius:0;padding:0 13px}.filter-count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--green);font-size:12px}.tool-btn[aria-expanded="true"] .filter-count{background:var(--green);color:#fff}
    .workspace{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}#map{height:100%;width:100%;background:#d9e1dc}.list-panel{position:absolute;z-index:700;inset:0 auto 0 0;width:min(390px,36vw);background:rgba(244,240,230,.97);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}.list-panel.open{transform:translateX(0)}.list-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);font-weight:900}.result-count{font-size:13px;color:var(--muted);font-weight:650}.course-list{overflow:auto;padding:8px}.course-row{width:100%;text-align:left;border:1px solid transparent;border-radius:12px;background:transparent;padding:12px;display:grid;grid-template-columns:12px 1fr;gap:10px;color:var(--ink)}.course-row:hover,.course-row.selected{background:#fff;border-color:var(--line)}.type-dot{width:11px;height:11px;border-radius:50%;margin-top:5px}.course-name{font-weight:900}.course-meta{font-size:13px;color:var(--muted);margin-top:2px}.empty{padding:36px 20px;text-align:center;color:var(--muted)}
    .map-action{position:absolute;z-index:650;border:0;border-radius:12px;background:#fff;color:var(--green);box-shadow:0 2px 12px rgba(0,0,0,.2);font-weight:900}.locate{right:12px;bottom:28px;width:46px;height:46px;font-size:20px}.legend{position:absolute;z-index:640;right:12px;bottom:84px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.94);box-shadow:0 2px 12px rgba(0,0,0,.16);font-size:12px}.legend-row{display:flex;align-items:center;gap:7px;margin:3px 0}.legend .type-dot{margin:0;width:9px;height:9px}
    .marker-pin{width:16px;height:16px;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.45)}.marker-pin.selected{width:22px;height:22px;border:4px solid var(--gold)}.cluster{display:grid;place-items:center;width:38px;height:38px;border:3px solid rgba(255,255,255,.9);border-radius:50%;background:var(--green);color:#fff;font-weight:900;box-shadow:0 2px 10px rgba(0,0,0,.28)}
    .overlay{position:fixed;z-index:1990;inset:0;background:rgba(7,21,13,.46);opacity:0;pointer-events:none;transition:opacity .18s}.overlay.show{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:2000;background:var(--cream);box-shadow:var(--shadow);transition:transform .22s ease}.filter-sheet{top:0;right:0;width:min(390px,94vw);height:100dvh;transform:translateX(105%);padding:22px;overflow:auto}.filter-sheet.open{transform:translateX(0)}.detail-sheet{right:16px;top:84px;width:min(390px,calc(100vw - 32px));max-height:calc(100dvh - 100px);border-radius:18px;transform:translateX(calc(100% + 30px));overflow:auto}.detail-sheet.open{transform:translateX(0)}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet-title{margin:0;font-size:22px;line-height:1.15;color:var(--green)}.close-btn{width:40px;height:40px;border:0;border-radius:10px;background:rgba(15,43,29,.08);color:var(--green);font-size:22px}.filter-group{border:0;border-top:1px solid var(--line);margin:20px 0 0;padding:16px 0 0}.filter-group legend{font-weight:900;padding:0}.check{display:flex;align-items:center;gap:10px;padding:9px 0}.check input{width:20px;height:20px;accent-color:var(--green)}.filter-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.primary,.secondary{min-height:46px;border-radius:12px;font-weight:900}.primary{background:var(--green);border:1px solid var(--green);color:#fff}.secondary{background:transparent;border:1px solid var(--green);color:var(--green)}
    .detail-content{padding:20px}.detail-sub{color:var(--muted);margin:6px 0 14px}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-weight:800;background:#fff}.detail-address{margin:14px 0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.stat-label{font-size:12px;color:var(--muted);font-weight:800}.stat-value{font-size:17px;font-weight:950;margin-top:2px}.link-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail-link{display:grid;place-items:center;min-height:44px;border-radius:11px;background:var(--green);color:#fff;text-decoration:none;font-weight:900}.detail-link.gold{background:var(--gold);color:var(--green)}.anecdote{white-space:pre-line;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.status{position:absolute;z-index:800;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:10px 14px;border-radius:999px;background:var(--green);color:#fff;font-weight:800;box-shadow:var(--shadow);display:none}.status.show{display:block}.noscript{padding:20px}.leaflet-control-zoom a{width:38px!important;height:38px!important;line-height:38px!important}.leaflet-bottom.leaflet-left{bottom:8px}
    @media(max-width:700px){.toolbar{grid-template-columns:minmax(0,1fr) auto}.view-toggle{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.seg-btn{height:38px}.tool-btn{padding:0 12px}.list-panel{width:100%;border:0}.legend{display:none}.detail-sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:76dvh;border-radius:20px 20px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom)}.detail-sheet.open{transform:translateY(0)}.filter-sheet{top:auto;bottom:0;width:100%;height:auto;max-height:86dvh;border-radius:20px 20px 0 0;transform:translateY(105%);padding-bottom:max(22px,env(safe-area-inset-bottom))}.filter-sheet.open{transform:translateY(0)}.locate{bottom:18px}.leaflet-control-zoom{margin-top:12px!important}.sheet-handle{width:46px;height:5px;border-radius:999px;background:rgba(15,43,29,.2);margin:10px auto 2px}}
    @media(max-width:340px){.toolbar{padding-left:8px;padding-right:8px;gap:6px}.tool-btn{padding:0 9px}.filter-count{display:none}.search{padding-left:11px}.detail-grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="app" class="app">
    <header class="toolbar">
      <div class="search-wrap"><label for="search" hidden>Search courses or cities</label><input id="search" class="search" type="search" placeholder="Search courses or cities" autocomplete="off"><button id="clearSearch" class="search-clear" aria-label="Clear search">×</button></div>
      <button id="filterButton" class="tool-btn" aria-controls="filterSheet" aria-expanded="false">Filters<span id="filterCount" class="filter-count" hidden>0</span></button>
      <div class="view-toggle" role="group" aria-label="View"><button id="mapView" class="seg-btn active" aria-pressed="true">Map</button><button id="listView" class="seg-btn" aria-pressed="false">List</button></div>
    </header>
    <main class="workspace">
      <div id="map" aria-label="Interactive map of Colorado golf courses"></div>
      <section id="listPanel" class="list-panel" aria-label="Course list"><div class="list-head"><div>Colorado courses</div><div id="resultCount" class="result-count"></div></div><div id="courseList" class="course-list"></div></section>
      <button id="locate" class="map-action locate" aria-label="Use my location" title="Use my location">◎</button>
      <div id="legend" class="legend" aria-label="Course type legend"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
  </div>
  <div id="overlay" class="overlay"></div>
  <aside id="filterSheet" class="sheet filter-sheet" aria-hidden="true" aria-labelledby="filterTitle"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="filterTitle" class="sheet-title">Filters</h2><button class="close-btn" data-close="filters" aria-label="Close filters">×</button></div><fieldset class="filter-group"><legend>Journey</legend><label class="check"><input type="checkbox" data-filter="played" value="played">Played by Cam</label><label class="check"><input type="checkbox" data-filter="played" value="not-played">Not played by Cam</label><label class="check"><input type="checkbox" data-filter="video" value="video">Has video review</label></fieldset><fieldset class="filter-group"><legend>Course type</legend><div id="typeFilters"></div></fieldset><div class="filter-actions"><button id="resetFilters" class="secondary">Reset</button><button id="applyFilters" class="primary">Show courses</button></div></aside>
  <aside id="detailSheet" class="sheet detail-sheet" aria-hidden="true" aria-labelledby="detailTitle"><div class="sheet-handle"></div><div id="detailContent" class="detail-content"></div></aside>
  <noscript><div class="noscript">JavaScript is required for the interactive map. <a href="https://everycourse.golf/pages/course-directory">Open the searchable course directory.</a></div></noscript>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
  'use strict';
  (() => {
    const COLORS={Public:'#2ecc71',Private:'#3498db','Semi-Private':'#9b59b6',Resort:'#f39c12','Permanently Closed':'#7b827e'};
    const TYPES=Object.keys(COLORS), CO_BOUNDS=L.latLngBounds([36.85,-109.15],[41.05,-102.0]);
    const state={courses:[],filtered:[],markers:new Map(),selected:null,view:'map',filters:{played:new Set(),video:false,types:new Set(TYPES)}};
    const $=id=>document.getElementById(id); const el=(tag,className,text)=>{const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n};
    const safeUrl=value=>{try{const u=new URL(value,location.href);return u.protocol==='https:'?u.href:null}catch{return null}};
    const map=L.map('map',{zoomControl:true,minZoom:6,maxZoom:18,maxBounds:L.latLngBounds([35.5,-111],[42.3,-100.5]),maxBoundsViscosity:.7,preferCanvas:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors',crossOrigin:true}).addTo(map);map.fitBounds(CO_BOUNDS,{padding:[10,10]});
const clusters=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:35,disableClusteringAtZoom:20,spiderfyOnMaxZoom:true,iconCreateFunction:c=>L.divIcon({html:`<div class="cluster">${c.getChildCount()}</div>`,className:'',iconSize:[38,38]})});map.addLayer(clusters);    function markerIcon(course,selected=false){const pin=el('div',`marker-pin${selected?' selected':''}`);pin.style.background=COLORS[course.type]||COLORS.Public;return L.divIcon({html:pin.outerHTML,className:'',iconSize:selected?[22,22]:[16,16],iconAnchor:selected?[11,11]:[8,8]})}
    function addStaticUi(){TYPES.forEach(type=>{const row=el('div','legend-row'),dot=el('span','type-dot');dot.style.background=COLORS[type];row.append(dot,el('span','',type));$('legend').append(row);const label=el('label','check'),input=el('input'),fdot=el('span','type-dot');input.type='checkbox';input.checked=true;input.dataset.filter='type';input.value=type;fdot.style.background=COLORS[type];label.append(input,fdot,el('span','',type));$('typeFilters').append(label)})}
    function validCourse(c){return c&&Number.isFinite(c.lat)&&Number.isFinite(c.lng)&&typeof c.name==='string'&&TYPES.includes(c.type)}
    async function load(){try{const response=await fetch(`courses.json?v=${Date.now()}`,{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(!data||!Array.isArray(data))throw new Error('Invalid course data');state.courses=data.filter(validCourse).map((course,index)=>({...course,id:index}));buildMarkers();applyFilters()}catch(error){console.error(error);showStatus('The course map could not load. Please try again.',true)}}
    function buildMarkers(){state.courses.forEach(course=>{const marker=L.marker([course.lat,course.lng],{icon:markerIcon(course),title:course.name,keyboard:true,riseOnHover:true});marker.on('click',()=>selectCourse(course,true));state.markers.set(course.id,marker)})}
    function matches(course){const query=$('search').value.trim().toLocaleLowerCase(),searchable=`${course.name} ${course.city||''} ${course.region||''}`.toLocaleLowerCase();if(query&&!searchable.includes(query))return false;if(!state.filters.types.has(course.type))return false;if(state.filters.played.size===1){if(state.filters.played.has('played')&&!course.played)return false;if(state.filters.played.has('not-played')&&course.played)return false}if(state.filters.video&&!course.has_video)return false;return true}
    function applyFilters(){state.filtered=state.courses.filter(matches).sort((a,b)=>a.name.localeCompare(b.name));clusters.clearLayers();state.filtered.forEach(c=>clusters.addLayer(state.markers.get(c.id)));renderList();updateCount();updateFilterCount();if(state.selected&&!state.filtered.some(c=>c.id===state.selected.id))closeDetail();$('clearSearch').classList.toggle('show',!!$('search').value);setTimeout(()=>map.invalidateSize(),20)}
    function updateCount(){$('resultCount').textContent=`${state.filtered.length} of ${state.courses.length} courses`;if(!state.filtered.length)showStatus('No courses match those filters.')}
    function renderList(){const list=$('courseList');list.replaceChildren();if(!state.filtered.length){list.append(el('div','empty','No courses match. Reset the filters and try again.'));return}const frag=document.createDocumentFragment();state.filtered.forEach(course=>{const button=el('button',`course-row${state.selected?.id===course.id?' selected':''}`),dot=el('span','type-dot'),text=el('span');button.type='button';dot.style.background=COLORS[course.type];text.append(el('span','course-name',course.name),el('div','course-meta',[course.city,course.type,course.played?`Played #${course.order||'—'}`:'Not played'].filter(Boolean).join(' · ')));button.append(dot,text);button.addEventListener('click',()=>selectCourse(course,true));frag.append(button)});list.append(frag)}
    function selectCourse(course,focus){if(state.selected){const old=state.markers.get(state.selected.id);if(old)old.setIcon(markerIcon(state.selected))}state.selected=course;const marker=state.markers.get(course.id);if(marker)marker.setIcon(markerIcon(course,true));renderList();renderDetail(course);openDetail();if(focus){setView('map');const target=L.latLng(course.lat,course.lng);map.setView(target,Math.max(map.getZoom(),12),{animate:true});if(innerWidth<701)setTimeout(()=>map.panBy([0,-Math.min(innerHeight*.24,170)],{animate:true}),280)}}
    function renderDetail(course){const root=$('detailContent');root.replaceChildren();const head=el('div','sheet-head'),titles=el('div'),title=el('h2','sheet-title',course.name),close=el('button','close-btn','×');title.id='detailTitle';titles.append(title,el('div','detail-sub',[course.city,course.region].filter(Boolean).join(' · ')));close.type='button';close.setAttribute('aria-label','Close course details');close.addEventListener('click',closeDetail);head.append(titles,close);const pill=el('div','pill'),dot=el('span','type-dot');dot.style.background=COLORS[course.type];pill.append(dot,el('span','',course.type));root.append(head,pill);if(course.address)root.append(el('div','detail-address',course.address));const grid=el('div','detail-grid');grid.append(stat('Course #',course.order??'—'),stat('First played',formatDate(course.first_played)),stat('Cam ranking',course.cam_ranking?`#${course.cam_ranking}`:'—'),stat('Status',course.played?'Played':'Not played'));root.append(grid);const links=el('div','link-grid');appendLink(links,'Apple Maps',course.apple_maps);appendLink(links,'Google Maps',course.google_maps);if(course.has_video)appendLink(links,'Watch video',course.video_url,true);root.append(links);if(course.anecdote)root.append(el('div','anecdote',course.anecdote))}
    function stat(label,value){const box=el('div','stat');box.append(el('div','stat-label',label),el('div','stat-value',String(value)));return box}
    function appendLink(parent,label,url,gold=false){const safe=safeUrl(url);if(!safe)return;const a=el('a',`detail-link${gold?' gold':''}`,label);a.href=safe;a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}
    function formatDate(value){if(!value)return'—';const d=new Date(`${value}T00:00:00`);return Number.isNaN(d.valueOf())?'—':new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(d)}
    function openDetail(){$('detailSheet').classList.add('open');$('detailSheet').setAttribute('aria-hidden','false');$('overlay').classList.add('show')}
    function closeDetail(){$('detailSheet').classList.remove('open');$('detailSheet').setAttribute('aria-hidden','true');$('overlay').classList.remove('show');if(state.selected){const marker=state.markers.get(state.selected.id);if(marker)marker.setIcon(markerIcon(state.selected))}state.selected=null;renderList()}
    function openFilters(){$('filterSheet').classList.add('open');$('filterSheet').setAttribute('aria-hidden','false');$('filterButton').setAttribute('aria-expanded','true');$('overlay').classList.add('show')}
    function closeFilters(){$('filterSheet').classList.remove('open');$('filterSheet').setAttribute('aria-hidden','true');$('filterButton').setAttribute('aria-expanded','false');$('overlay').classList.remove('show')}
    function syncFilters(){state.filters.played=new Set([...document.querySelectorAll('[data-filter="played"]:checked')].map(x=>x.value));state.filters.video=!!document.querySelector('[data-filter="video"]:checked');state.filters.types=new Set([...document.querySelectorAll('[data-filter="type"]:checked')].map(x=>x.value));applyFilters()}
    function resetFilters(){document.querySelectorAll('[data-filter="played"],[data-filter="video"]').forEach(x=>x.checked=false);document.querySelectorAll('[data-filter="type"]').forEach(x=>x.checked=true);syncFilters()}
    function updateFilterCount(){const count=state.filters.played.size+(state.filters.video?1:0)+(TYPES.length-state.filters.types.size);$('filterCount').textContent=count;$('filterCount').hidden=count===0}
    function setView(view){state.view=view;const list=view==='list';$('listPanel').classList.toggle('open',list);$('listView').classList.toggle('active',list);$('listView').setAttribute('aria-pressed',String(list));$('mapView').classList.toggle('active',!list);$('mapView').setAttribute('aria-pressed',String(!list));setTimeout(()=>map.invalidateSize(),210)}
    let statusTimer;function showStatus(message,persistent=false){clearTimeout(statusTimer);$('status').textContent=message;$('status').classList.add('show');if(!persistent)statusTimer=setTimeout(()=>$('status').classList.remove('show'),2600)}
    function locate(){if(!navigator.geolocation){showStatus('Location is not available in this browser.');return}showStatus('Finding your location…');navigator.geolocation.getCurrentPosition(pos=>{const here=L.latLng(pos.coords.latitude,pos.coords.longitude);if(!CO_BOUNDS.pad(.4).contains(here)){showStatus('Your location is outside the Colorado map.');return}L.circleMarker(here,{radius:8,color:'#0F2B1D',weight:3,fillColor:'#EFB93F',fillOpacity:1}).addTo(map).bindTooltip('You are here').openTooltip();map.setView(here,11);showStatus('Location found.')},()=>showStatus('Location permission was denied or unavailable.'),{enableHighAccuracy:false,timeout:8000,maximumAge:300000})}
    function debounce(fn,delay){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),delay)}}
    addStaticUi();$('search').addEventListener('input',debounce(applyFilters,120));$('clearSearch').addEventListener('click',()=>{$('search').value='';applyFilters();$('search').focus()});$('filterButton').addEventListener('click',openFilters);$('applyFilters').addEventListener('click',()=>{syncFilters();closeFilters()});$('resetFilters').addEventListener('click',resetFilters);document.querySelector('[data-close="filters"]').addEventListener('click',closeFilters);$('overlay').addEventListener('click',()=>{$('filterSheet').classList.contains('open')?closeFilters():closeDetail()});$('mapView').addEventListener('click',()=>setView('map'));$('listView').addEventListener('click',()=>setView('list'));$('locate').addEventListener('click',locate);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('filterSheet').classList.contains('open')?closeFilters():closeDetail()}});
    const resize=debounce(()=>map.invalidateSize({pan:false}),100);addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));addEventListener('pageshow',()=>setTimeout(resize,50));document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(resize,50)});new ResizeObserver(resize).observe($('map'));load();
  })();
  </script>
</body>
</html>
